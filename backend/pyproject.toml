[project]
name = "ai-improv-backend"
version = "0.1.0"
description = "Stock snapshot & SEC filing summarizer backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "yfinance>=0.2.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "openai>=1.40",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query() are designed to be used as argument defaults.
extend-ignore = ["B008"]
